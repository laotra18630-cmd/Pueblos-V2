name: Validar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  estatico:
    name: Comprobaciones estáticas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de los JavaScript
        run: |
          node --check scripts/app.js
          node --check sw.js
          node --check data/pueblos.js
          node --check data/picos.js
          node --check tests/estatico.js
          node --check tests/humo.js

      - name: Manifiesto, referencias, service worker y datos
        run: node tests/estatico.js
